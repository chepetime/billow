name: Setup workspace
description: Set up Node (version from .nvmrc) + pnpm and install dependencies with a checksum-keyed store cache.

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v5
      with:
        # .nvmrc is the single source of truth for the Node version. Do not
        # inline a number here: this file and the Dockerfile drifted apart
        # once already, and CI silently kept building on the old major.
        node-version-file: .nvmrc
        # setup-node v5 auto-caches the package manager from the
        # `packageManager` field, which probes for pnpm before it is
        # installed. We manage the pnpm store cache ourselves below.
        # https://github.com/actions/setup-node/issues/1357
        package-manager-cache: false

    # Node 26 dropped Corepack from the distribution, so pnpm is installed
    # directly at the version package.json already declares.
    - name: Install pnpm
      shell: bash
      run: npm install --global "$(node -p "require('./package.json').packageManager")"

    - name: Locate pnpm store
      id: pnpm-store
      shell: bash
      run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      uses: actions/cache@v6
      with:
        path: ${{ steps.pnpm-store.outputs.dir }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
