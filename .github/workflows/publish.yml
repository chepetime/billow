name: Publish Billow image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to publish (e.g. v0.1.7)"
        required: true
  # Callable by release.yml. A tag pushed by a workflow using GITHUB_TOKEN does
  # not trigger other workflows, so the release job invokes this one directly.
  workflow_call:
    inputs:
      version:
        description: "Image tag to publish (e.g. v0.1.7)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/chepetime/billow

jobs:
  # Each architecture is built on a runner of that architecture, and the two
  # results are stitched into one manifest list afterwards.
  #
  # Emulation was tried first and does not work. Building arm64 under QEMU on
  # an amd64 runner died in `next build` with:
  #
  #   qemu: uncaught target signal 4 (Illegal instruction) - core dumped
  #   Next.js build worker exited with code: null and signal: SIGILL
  #
  # QEMU's arm64 translation does not cover everything the build workers
  # execute, and the failure is in the emulator rather than in this repo — the
  # same commit builds cleanly on real hardware of both architectures. Native
  # runners are also far faster, and free for public repositories.
  build:
    strategy:
      # Publish nothing rather than half a manifest: if one architecture fails,
      # cancel the other so `merge` never runs on a partial set.
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    # Each matrix leg overwrites this, and which one lands last is arbitrary.
    # Safe only because every leg resolves the identical version from the same
    # inputs — do not add an output here that differs per architecture.
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # A called workflow checks out the SHA that triggered the run, which for
      # release.yml is the commit *before* the version bump. Check out the tag
      # explicitly so the image is built from the released source and bakes the
      # correct NEXT_PUBLIC_APP_VERSION.
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version || github.ref }}

      - name: Resolve version tag
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE_NAME}:${VERSION} for ${{ matrix.platform }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest with no tag: a tag here would have each architecture
      # overwrite the other. `merge` applies the tags once both digests exist.
      #
      # The cache is keyed per architecture because the layers are genuinely
      # different builds, not two views of one.
      - name: Read pinned Node and pnpm versions
        run: echo "NODE_VERSION=$(tr -d ' \t\n\r' < .nvmrc)" >> "$GITHUB_ENV"
          echo "PNPM_VERSION=$(node -p "require('./package.json').packageManager")" >> "$GITHUB_ENV"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            PNPM_VERSION=${{ env.PNPM_VERSION }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }},mode=max

      # The digest is passed to `merge` as an empty file named after it, which
      # is the documented way to collect these across matrix legs.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the per-architecture images into the manifest list that the tags
  # actually point at. The store repo pins this list's digest, so one pin stays
  # correct for both architectures.
  merge:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.build.outputs.version }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${VERSION}" \
            --tag "${IMAGE_NAME}:latest" \
            $(printf "${IMAGE_NAME}@sha256:%s " *)

  # Proves the tag is really pullable and the image actually boots, applies
  # migrations, and serves traffic — the checks that used to be done by hand
  # (and were once skipped, leaving the store pointing at a missing tag).
  verify:
    needs: merge
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: billow
          POSTGRES_USER: billow
          POSTGRES_PASSWORD: billow-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billow -d billow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version || github.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Asserts both architectures are present, not merely that the tag
      # resolves. A silently amd64-only manifest still passes every other check
      # in this job, because the runner is amd64 — it would only surface as an
      # install failure on a Raspberry Pi.
      - name: Confirm the published manifest resolves for both architectures
        run: |
          VERSION="${{ needs.merge.outputs.version }}"
          MANIFEST=$(docker manifest inspect "${IMAGE_NAME}:${VERSION}")
          echo "$MANIFEST" | jq -r '.manifests[] | "\(.platform.os)/\(.platform.architecture)"' | sort -u
          for PLATFORM in amd64 arm64; do
            echo "$MANIFEST" \
              | jq -e --arg a "$PLATFORM" \
                '.manifests | map(select(.platform.os == "linux" and .platform.architecture == $a)) | length > 0' \
                > /dev/null \
              || { echo "::error::linux/${PLATFORM} missing from ${IMAGE_NAME}:${VERSION}"; exit 1; }
          done
          echo "${IMAGE_NAME}:${VERSION} publishes linux/amd64 and linux/arm64"

      - name: Boot the published image
        run: |
          docker run -d --name billow-verify --network host \
            -e DATABASE_URL='postgresql://billow:billow-password@localhost:5432/billow' \
            -e BETTER_AUTH_SECRET='ci-only-secret-with-at-least-32-characters' \
            -e PORT=3000 \
            "${IMAGE_NAME}:${{ needs.merge.outputs.version }}"

      # Guards against building from the pre-bump commit: assert the version
      # baked into the image, rather than scraping it out of a page.
      - name: Confirm the image contains the released version
        run: |
          EXPECTED="${{ needs.merge.outputs.version }}"
          EXPECTED="${EXPECTED#v}"
          ACTUAL=$(docker exec billow-verify node -p "require('/repo/apps/web/package.json').version")
          echo "image contains ${ACTUAL}, released ${EXPECTED}"
          [ "$ACTUAL" = "$EXPECTED" ] || exit 1

      - name: Smoke test
        run: sh scripts/smoke.sh http://localhost:3000

      - name: Container logs
        if: always()
        run: docker logs billow-verify --tail 80 || true
