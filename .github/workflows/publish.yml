name: Publish Billow image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to publish (e.g. v0.1.7)"
        required: true
  # Callable by release.yml. A tag pushed by a workflow using GITHUB_TOKEN does
  # not trigger other workflows, so the release job invokes this one directly.
  workflow_call:
    inputs:
      version:
        description: "Image tag to publish (e.g. v0.1.7)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/chepetime/billow

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # A called workflow checks out the SHA that triggered the run, which for
      # release.yml is the commit *before* the version bump. Check out the tag
      # explicitly so the image is built from the released source and bakes the
      # correct NEXT_PUBLIC_APP_VERSION.
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version || github.ref }}

      - name: Resolve version tag
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${IMAGE_NAME}:${VERSION} and :latest"

      # arm64 is built under emulation on an amd64 runner, so QEMU has to be
      # registered before buildx can target it.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both architectures under one manifest list, so the digest pinned in the
      # store repo stays correct for either. amd64 covers Umbrel Home and most
      # mini-PCs; arm64 covers Raspberry Pi, which could not run this image at
      # all before.
      #
      # Nothing in the runtime is architecture-specific by luck: Prisma 7's
      # `prisma-client` generator emits TypeScript and queries go through the
      # `pg` driver adapter, so there is no query-engine binary. The only
      # native pieces are the schema-engine used by `migrate deploy` and
      # sharp, and both are installed inside the per-platform build.
      #
      # The arm64 half is emulated and therefore slow. The registry cache keeps
      # unchanged layers from being rebuilt on every release.
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

  # Proves the tag is really pullable and the image actually boots, applies
  # migrations, and serves traffic — the checks that used to be done by hand
  # (and were once skipped, leaving the store pointing at a missing tag).
  verify:
    needs: publish
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: billow
          POSTGRES_USER: billow
          POSTGRES_PASSWORD: billow-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billow -d billow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version || github.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Asserts both architectures are present, not merely that the tag
      # resolves. A silently amd64-only manifest still passes every other check
      # in this job, because the runner is amd64 — it would only surface as an
      # install failure on a Raspberry Pi.
      - name: Confirm the published manifest resolves for both architectures
        run: |
          VERSION="${{ needs.publish.outputs.version }}"
          MANIFEST=$(docker manifest inspect "${IMAGE_NAME}:${VERSION}")
          echo "$MANIFEST" | jq -r '.manifests[] | "\(.platform.os)/\(.platform.architecture)"' | sort -u
          for PLATFORM in amd64 arm64; do
            echo "$MANIFEST" \
              | jq -e --arg a "$PLATFORM" \
                '.manifests | map(select(.platform.os == "linux" and .platform.architecture == $a)) | length > 0' \
                > /dev/null \
              || { echo "::error::linux/${PLATFORM} missing from ${IMAGE_NAME}:${VERSION}"; exit 1; }
          done
          echo "${IMAGE_NAME}:${VERSION} publishes linux/amd64 and linux/arm64"

      - name: Boot the published image
        run: |
          docker run -d --name billow-verify --network host \
            -e DATABASE_URL='postgresql://billow:billow-password@localhost:5432/billow' \
            -e BETTER_AUTH_SECRET='ci-only-secret-with-at-least-32-characters' \
            -e PORT=3000 \
            "${IMAGE_NAME}:${{ needs.publish.outputs.version }}"

      # Guards against building from the pre-bump commit: assert the version
      # baked into the image, rather than scraping it out of a page.
      - name: Confirm the image contains the released version
        run: |
          EXPECTED="${{ needs.publish.outputs.version }}"
          EXPECTED="${EXPECTED#v}"
          ACTUAL=$(docker exec billow-verify node -p "require('/repo/apps/web/package.json').version")
          echo "image contains ${ACTUAL}, released ${EXPECTED}"
          [ "$ACTUAL" = "$EXPECTED" ] || exit 1

      - name: Smoke test
        run: sh scripts/smoke.sh http://localhost:3000

      - name: Container logs
        if: always()
        run: docker logs billow-verify --tail 80 || true
