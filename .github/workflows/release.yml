name: Release

# One-click release. Bumps the three package.json versions, commits, tags, and
# then calls the publish workflow (which also verifies the image boots).
#
# Run it from the Actions tab with a version like 0.1.18, or:
#   gh workflow run release.yml -f version=0.1.18

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, without the leading v (e.g. 0.1.18)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Validate and bump versions
        id: bump
        run: |
          VERSION="${{ inputs.version }}"
          case "$VERSION" in
            v*) echo "Pass the version without the leading 'v' (got $VERSION)." >&2; exit 1 ;;
          esac
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must look like 1.2.3 (got $VERSION)." >&2
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists." >&2
            exit 1
          fi

          # Derived from the workspace rather than hardcoded: a fixed list went
          # stale the moment @billow/auth and @billow/email were added, leaving
          # them behind at the previous version while everything else moved.
          # config/* and packages/e2e are excluded on purpose — they are build
          # tooling and tests, not part of the shipped app.
          # shellcheck disable=SC2016 # the single quotes are deliberate: this is
          # a JavaScript program, and its ${...} template literals must reach
          # node intact rather than being expanded by the shell first.
          node -e '
            const fs = require("fs");
            const path = require("path");
            const version = process.argv[1];

            const roots = ["apps", "packages"];
            const skip = new Set(["packages/e2e"]);
            const files = ["package.json"];

            for (const root of roots) {
              if (!fs.existsSync(root)) continue;
              for (const entry of fs.readdirSync(root)) {
                const dir = `${root}/${entry}`;
                if (skip.has(dir)) continue;
                const manifest = path.join(dir, "package.json");
                if (fs.existsSync(manifest)) files.push(manifest);
              }
            }

            for (const f of files) {
              const pkg = JSON.parse(fs.readFileSync(f, "utf8"));
              if (!("version" in pkg)) continue;
              pkg.version = version;
              // Mode 644 explicitly: writeFileSync preserves an existing
              // file mode, but a manifest that ever lands at 600 is copied
              // into the image that way and the unprivileged user can no
              // longer read it, killing the container at startup.
              fs.writeFileSync(f, JSON.stringify(pkg, null, 2) + "\n", { mode: 0o644 });
              console.log(`bumped ${f} -> ${version}`);
            }
          ' "$VERSION"

          # Keep the lockfile honest; workspace version bumps should not change it.
          pnpm install --lockfile-only
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # Runs against the bumped tree on purpose: what is verified here is
      # exactly what the next step commits and tags.
      #
      # Two changes that look obvious from a profile are deliberately NOT made.
      # Both were measured, not guessed:
      #
      #  1. No `.turbo/cache` restore, unlike ci.yml. It can never hit. The bump
      #     above rewrites the `version` field in the root manifest and in every
      #     workspace manifest, and turbo hashes each package's package.json as
      #     a task input — bumping all nine changes every task hash in the
      #     graph, `@billow/web#build` included. A cache saved by CI on the
      #     parent commit is a guaranteed miss here, so the step would cost time
      #     and return nothing. Restoring it only pays off if verification moves
      #     to before the bump, which gives up verifying the tagged tree.
      #
      #  2. `test:run` and `build` are not merged into one `turbo run test:run
      #     build` graph. Nothing in turbo.json orders them, so
      #     `@billow/db#build` (`prisma generate`) would run concurrently with
      #     tests that import the generated client — apps/web's
      #     invoice-status.test.ts does. That trades an intermittent release
      #     failure for about twenty seconds.
      #
      # biome is not a turbo task and only reads files, so lint is the one thing
      # that can safely overlap. It is backgrounded and its status collected
      # below rather than left to fire and forget.
      - name: Verify the release candidate
        run: |
          pnpm run db:generate

          pnpm run lint > /tmp/lint.log 2>&1 &
          lint_pid=$!

          status=0
          if ! pnpm run test:run; then
            status=1
          elif ! pnpm run build; then
            status=1
          fi

          if ! wait "$lint_pid"; then
            status=1
          fi
          echo "::group::lint"
          cat /tmp/lint.log
          echo "::endgroup::"

          exit "$status"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Globbed to match the bump step above, which derives its file list
          # from the workspace. A hardcoded list here silently discarded the
          # bumps to every package it did not name: 0.1.28 bumped eight
          # manifests and committed three, leaving @billow/auth and
          # @billow/email behind at the previous version. Unchanged manifests
          # stage as no-ops, so listing them all is safe.
          git add package.json apps/*/package.json packages/*/package.json pnpm-lock.yaml
          git commit -m "Bump version to ${{ inputs.version }}"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          git push origin "${{ steps.bump.outputs.tag }}"

  publish:
    needs: tag
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: read
      packages: write

  summary:
    needs: [tag, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Next steps
        run: |
          {
            echo "### Released ${{ needs.tag.outputs.tag }}"
            echo
            echo "Image \`ghcr.io/chepetime/billow:${{ needs.tag.outputs.tag }}\` was published and smoke-tested."
            echo
            echo "**Remaining manual step:** bump the Umbrel store repo"
            echo "(\`billow/docker-compose.yml\` image tag and \`billow/umbrel-app.yml\` version + releaseNotes),"
            echo "then refresh the community store in Umbrel."
          } >> "$GITHUB_STEP_SUMMARY"
