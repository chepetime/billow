name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs on the same branch are pointless; cancel them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        task: [lint, test:run, build]

    env:
      # Build compiles the better-auth route; give it a valid dummy secret.
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ matrix.task }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ matrix.task }}-

      - name: Check pinned versions have one source of truth
        run: sh scripts/check-versions.sh

      # actionlint catches schema and expression errors; check-workflows.sh
      # catches the folded-scalar case actionlint exits 0 on.
      #
      # Pinned. Unpinned, the download script takes the latest release, so a new
      # actionlint — or a new shellcheck bundled behind it — turns main red with
      # no commit to explain it. That happened: 1.7.12 began reporting two
      # deliberate shell patterns and broke a build nobody had touched. Bump this
      # on purpose, not by surprise.
      #
      # The upstream install script used to be piped straight from
      # raw.githubusercontent.com into bash: pinning the version number closed
      # the drift above, but the script contents were still fetched live and
      # unverified on every run. This fetches the release asset directly and
      # checks it against the sha256 rhysd publishes in that release's
      # checksums file before anything is executed. ubuntu-latest is always
      # amd64, so only that one asset is needed — bump ACTIONLINT_SHA256
      # alongside ACTIONLINT_VERSION from that file if this is ever upgraded.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" actionlint
          sudo mv actionlint /usr/local/bin/

      - name: Check workflow files
        run: sh scripts/check-workflows.sh

      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Run ${{ matrix.task }}
        run: pnpm run ${{ matrix.task }}

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: billow
          POSTGRES_USER: billow
          POSTGRES_PASSWORD: billow-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billow -d billow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://billow:billow-password@localhost:5432/billow

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Validate Prisma schema
        run: pnpm run db:validate

      - name: Apply migrations
        run: pnpm --filter @billow/db db:migrate

  # Fails on high/critical advisories that have not been reviewed. `pnpm audit`
  # cannot be used here: the registry replies with gzip that the runtime does
  # not transparently decode.
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Audit dependencies
        run: node scripts/audit-deps.mjs

  # Build and boot the production image the same way Umbrel will. Catches
  # Dockerfile and runtime breakage (missing prod deps, migrations that fail
  # at container start) before a tag is ever cut.
  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: billow
          POSTGRES_USER: billow
          POSTGRES_PASSWORD: billow-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billow -d billow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Read pinned Node and pnpm versions
        run: |
          echo "NODE_VERSION=$(tr -d ' \t\n\r' < .nvmrc | sed 's/^v//')" >> "$GITHUB_ENV"
          echo "PNPM_VERSION=$(node -p "require('./package.json').packageManager")" >> "$GITHUB_ENV"

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            PNPM_VERSION=${{ env.PNPM_VERSION }}
          push: false
          load: true
          tags: billow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the image
        run: |
          docker run -d --name billow-ci --network host \
            -e DATABASE_URL='postgresql://billow:billow-password@localhost:5432/billow' \
            -e BETTER_AUTH_SECRET='ci-only-secret-with-at-least-32-characters' \
            -e PORT=3000 \
            billow:ci

      - name: Smoke test
        run: sh scripts/smoke.sh http://localhost:3000

      - name: Container logs
        if: always()
        run: docker logs billow-ci --tail 80 || true
