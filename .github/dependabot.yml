version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine stuff; majors still come through individually.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Minor/major bumps have shipped schema-affecting breaking changes
      # before (1.7 added a required Account.issuer column and a compound
      # unique index — see packages/db/prisma/migrations/*_account_issuer)
      # and can again; upgrade deliberately; not automatically.
      - dependency-name: "better-auth"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@better-auth/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
